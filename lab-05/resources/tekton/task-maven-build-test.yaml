apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: maven-build-test
  namespace: flink
spec:
  workspaces:
    - name: source
  steps:
    - name: package
      image: maven:3.9-eclipse-temurin-21
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        mvn -B -q package
        ls -l target/ci-app.jar
