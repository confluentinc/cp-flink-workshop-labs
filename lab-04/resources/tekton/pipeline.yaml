apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: flink-ci
  namespace: flink
spec:
  params:
    - name: repo-url
    - name: revision
      default: main
    - name: image
      default: 10.96.0.50:5000/ci-app
    - name: tag
  workspaces:
    - name: shared
  tasks:
    - name: fetch-source
      taskRef: { name: fetch-source }
      params:
        - { name: repo-url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }
      workspaces:
        - { name: source, workspace: shared }
    - name: build-test
      runAfter: [fetch-source]
      taskRef: { name: maven-build-test }
      workspaces:
        - { name: source, workspace: shared }
    - name: schema-check
      runAfter: [build-test]
      taskRef: { name: schema-compat-check }
      workspaces:
        - { name: source, workspace: shared }
    - name: image-build
      runAfter: [schema-check]
      taskRef: { name: kaniko-build-push }
      params:
        - { name: image, value: $(params.image) }
        - { name: tag, value: $(params.tag) }
      workspaces:
        - { name: source, workspace: shared }
    - name: deploy
      runAfter: [image-build]
      taskRef: { name: deploy-flinkapp }
      params:
        - { name: image, value: $(params.image) }
        - { name: tag, value: $(params.tag) }
