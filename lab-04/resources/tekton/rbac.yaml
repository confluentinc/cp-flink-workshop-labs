apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-pipeline
  namespace: flink
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-pipeline-deployer
  namespace: flink
rules:
  - apiGroups: ["platform.confluent.io"]
    resources: ["flinkapplications"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-pipeline-deployer
  namespace: flink
subjects:
  - kind: ServiceAccount
    name: ci-pipeline
    namespace: flink
roleRef:
  kind: Role
  name: ci-pipeline-deployer
  apiGroup: rbac.authorization.k8s.io
